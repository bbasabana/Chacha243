<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4DB2FF"/><stop offset="0.55" stop-color="#007FFF"/><stop offset="1" stop-color="#004FB5"/>
  </linearGradient>
  <radialGradient id="shine" cx="0.28" cy="0.18" r="0.75">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glassPlane" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFE4FF"/>
  </linearGradient>
  <linearGradient id="starFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE866"/><stop offset="1" stop-color="#F2C800"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#00163A" flood-opacity="0.45"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="18" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g transform="rotate(-45 512 512)">
  <line x1="-1600" y1="512" x2="540" y2="512" stroke="#F7D618" stroke-width="300" stroke-linecap="round"/>
  <line x1="-1600" y1="512" x2="540" y2="512" stroke="#CE1021" stroke-width="226" stroke-linecap="round"/>
  <line x1="-1600" y1="438" x2="470" y2="438" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="34" stroke-linecap="round"/>
  <line x1="-1600" y1="586" x2="520" y2="586" stroke="#000000" stroke-opacity="0.10" stroke-width="30" stroke-linecap="round"/>
</g>
</svg>
